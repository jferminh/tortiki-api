# ============================================================
# Pipeline CI/CD — Tortiki API
# ============================================================
# Jobs :
#   1. checkstyle     → Vérification Google Style (fail-fast)
#   2. build-and-test → Compilation, Tests JUnit 5, JaCoCo,
#                       Allure Reports, SonarCloud
#   3. docker         → Build & Push image (main uniquement)
#   4. notify         → Notification Teams (optionnelle)
# ============================================================
name: CI/CD — Tortiki API

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  POSTGRES_DB: tortiki_test
  POSTGRES_USER: tortiki
  POSTGRES_PASSWORD: tortiki_secret

jobs:
  checkstyle:
    name: Checkstyle Google Style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Installation Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Vérification Checkstyle — 0 violation obligatoire
        run: ./mvnw checkstyle:check --no-transfer-progress

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: checkstyle
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Attente PostgreSQL — service prêt
        run: |
          until pg_isready -h localhost -p 5432 -U "$POSTGRES_USER"; do
            echo "PostgreSQL non disponible, attente..."
            sleep 2
          done
          echo "PostgreSQL prêt"
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}

      - name: Build, Tests JUnit 5, JaCoCo et Allure
        run: ./mvnw -B --no-transfer-progress clean verify -P integration
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ env.POSTGRES_DB }}
          SPRING_DATASOURCE_USERNAME: ${{ env.POSTGRES_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Génération rapport Allure HTML
        if: always()
        run: ./mvnw -B --no-transfer-progress allure:report

      - name: Upload rapport Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 30

      - name: Publication Allure sur GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin/

      - name: Upload rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Analyse SonarCloud
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          ./mvnw -B --no-transfer-progress sonar:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.source=21 \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Upload artefact JAR
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tortiki-api-jar
          path: target/tortiki-api-*.jar
          retention-days: 1

      - name: Résumé du pipeline
        if: always()
        run: |
          echo "## Résultat CI — Tortiki API" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Élément | Valeur |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branche | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Déclenché par | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Profil Maven | \`integration\` (tous les tests) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rapport Allure | Voir onglet Artifacts |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rapport JaCoCo | Voir onglet Artifacts |" >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Téléchargement JAR depuis Job 2
        uses: actions/download-artifact@v4
        with:
          name: tortiki-api-jar
          path: target/

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calcul du nom d'image Docker
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=${DOCKERHUB_USERNAME}/tortiki-api" >> "$GITHUB_OUTPUT"

      - name: Build et Push image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  notify:
    name: Notification Teams
    runs-on: ubuntu-latest
    needs: [ build-and-test, docker ]
    timeout-minutes: 3
    if: always()
    permissions:
      contents: read

    env:
      TEAMS_HOOK_URL: ${{ secrets.TEAMS_WEBHOOK }}

    steps:
      - name: Préparation du statut pipeline
        id: status
        run: |
          BUILD="${{ needs.build-and-test.result }}"
          DOCKER="${{ needs.docker.result }}"

          if [[ "$DOCKER" == "skipped" ]]; then
            DOCKER="success"
          fi

          if [[ "$BUILD" == "success" && "$DOCKER" == "success" ]]; then
            echo "color=3066993"  >> $GITHUB_OUTPUT
            echo "emoji=✅"       >> $GITHUB_OUTPUT
            echo "status=SUCCÈS"  >> $GITHUB_OUTPUT
          elif [[ "$BUILD" == "failure" || "$DOCKER" == "failure" ]]; then
            echo "color=15158332" >> $GITHUB_OUTPUT
            echo "emoji=❌"       >> $GITHUB_OUTPUT
            echo "status=ÉCHEC"   >> $GITHUB_OUTPUT
          else
            echo "color=16776960" >> $GITHUB_OUTPUT
            echo "emoji=⚠️"       >> $GITHUB_OUTPUT
            echo "status=ANNULÉ"  >> $GITHUB_OUTPUT
          fi

      - name: Notification Teams
        continue-on-error: true
        if: ${{ env.TEAMS_HOOK_URL != '' }}
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ms-teams-webhook-uri: ${{ env.TEAMS_HOOK_URL }}
          notification-summary: >-
            ${{ steps.status.outputs.emoji }} Pipeline ${{ steps.status.outputs.status }}
            — tortiki-api
            | Branche : ${{ github.ref_name }}
            | Par : ${{ github.actor }}
            | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          notification-color: ${{ steps.status.outputs.color }}
          timezone: Europe/Paris