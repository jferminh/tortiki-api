# Profil PROD — Toutes les valeurs sensibles viennent des variables d'environnement
# Ne jamais committer de credentials réels dans ce fichier

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    show-sql: false

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

nominatim:
  base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
  user-agent: ${NOMINATIM_USER_AGENT:Tortiki/1.0}
  timeout-seconds: ${NOMINATIM_TIMEOUT:5}

spring.mail:
  host: ${MAIL_HOST}
  port: ${MAIL_PORT}
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}            # Railway injecte $PORT automatiquement

# ===== SPRINGDOC — désactivé en production =====
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.tortiki: INFO
    root: WARN