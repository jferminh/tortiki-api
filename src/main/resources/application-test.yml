# Profil TEST — Utilisé automatiquement avec @ActiveProfiles("test")
# Testcontainers démarre son propre PostgreSQL éphémère

spring:
  datasource:
    url: jdbc:tc:postgresql:16:///tortiki_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  flyway:
    enabled: true               # Les migrations s'appliquent sur le conteneur de test

  jpa:
    show-sql: false

minio:
  endpoint: http://localhost:9000
  access-key: test
  secret-key: testpassword
  bucket: tortiki-test

spring.mail:
  host: localhost
  port: 1025

logging:
  level:
    com.tortiki: WARN           # Silencieux pendant les tests