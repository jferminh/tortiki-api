# Profil DEV — Docker Compose local
# Activation : spring.profiles.active=dev

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tortiki
    username: tortiki
    password: tortiki
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true              # Affiche les requêtes SQL en console

  devtools:
    restart:
      enabled: true

# MinIO local (Docker Compose)
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: tortiki-photos

# Email : MailHog en local (pas de vrai envoi)
spring.mail:
  host: localhost
  port: 1025
  username: ""
  password: ""

logging:
  level:
    com.tortiki: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true