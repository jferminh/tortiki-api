# Configuration commune — Tortiki API
# Les valeurs sensibles sont dans les fichiers de profil ou variables d'environnement

spring:
  application:
    name: tortiki-api

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway gère le schéma, pas Hibernate
    open-in-view: false         # Bonne pratique : désactiver l'antipattern OSIV
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB        # Limite upload photo annonce
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true               # Désactivé en prod dans application-prod.yml

server:
  port: 8080
  error:
    include-message: never      # Sécurité : ne pas exposer les messages d'erreur bruts
    include-stacktrace: never

logging:
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"