# ============================================================
# Profil test — utilisé par GitHub Actions CI
# PostgreSQL fourni par le service Docker du pipeline
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tortiki_test
    username: tortiki
    password: tortiki_secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Swagger désactivé en tests
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false