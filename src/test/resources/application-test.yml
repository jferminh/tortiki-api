# ============================================================
# Profil test — PostgreSQL éphémère fourni par Testcontainers
# Aucun service externe requis en CI ou en local.
# Prérequis : Docker disponible (CI : runner ubuntu-latest,
#             local : Docker Desktop démarré).
# ============================================================
spring:
  # spring.datasource.url / username / password intentionnellement absents :
  # ils sont injectés dynamiquement par @DynamicPropertySource (Testcontainers).
  # Ne pas les déclarer ici — toute valeur statique créerait une ambiguïté
  # et ferait échouer Flyway si le conteneur n'est pas encore démarré.
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

minio:
  endpoint: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket: tortiki-test

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.tortiki: INFO
    org.flywaydb: INFO